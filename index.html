<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英打遊戲版本一</title>
  <style>
    body {
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      background-color: #ffffff;
      color: #333333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }
    button {
      font-size: 1.2rem;
      padding: 12px 32px;
      border: 1px solid #cccccc;
      background-color: #f8f9fa;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e2e6ea;
    }
  </style>
</head>
<body>
  <h1>英打遊戲版本一</h1>
  <button type="button">開始</button>
</body>
</html>
